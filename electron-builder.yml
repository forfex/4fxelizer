# Placeholder IDs — change appId before the first public release (it can't change afterwards on macOS).
appId: com.4fx.4fxelizer
productName: 4FXELIZER
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - build/icon.png
  - build/icon.ico
  - LICENSE
  - THIRD_PARTY_NOTICES.md
# The renderer bundles all its deps; main/preload have no runtime deps.
npmRebuild: false
win:
  target: nsis
  executableName: 4fxelizer
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
mac:
  target: dmg
  category: public.app-category.graphics-design
  # Signing + notarization need an Apple Developer account (see docs/PLAN.md risks).
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Graphics
  maintainer: 4FX
  # Icons come from build/icons/ (16–512 px, scripts/make-icon.mjs), found there automatically,
  # so small launcher and dock icons stay sharp.
  # The launcher is 4fxelizer.desktop with StartupWMClass=4fxelizer, from desktopName in
  # package.json: it matches the window's WM_CLASS (X11) and app ID (Wayland), so docks match
  # the window to the launcher and show its icon instead of a generic one.
  syncDesktopName: true
  artifactName: ${name}-${version}-${arch}.${ext}
